<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Products | TAGD USA</title>
<meta name="description" content="Shop 3D printed NFC keychains made in Texas."/>
<link rel="icon" href="assets/logo.PNG"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/tailwind-config.js"></script>
<link rel="stylesheet" href="assets/site.css"/>
</head>
<body class="bg-surface text-on-surface font-body">
<div id="site-header"></div>
<main class="max-w-7xl mx-auto px-6 md:px-12 py-16">
<div class="mb-12 border-b-2 border-black pb-8">
<span class="text-tertiary font-bold tracking-widest text-xs font-mono">★ MADE IN USA // CERTIFIED</span>
<h1 class="headline-refined text-6xl md:text-8xl mt-4">THE <span class="text-primary">COLLECTION</span></h1>
<p class="mt-4 font-mono text-sm max-w-xl uppercase tracking-tight text-on-surface-variant">NFC-chipped keychains, 3D printed in virgin PLA. Program once, tap forever. Ships in under a week.</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10" id="product-grid"></div>
<section class="mt-20 bg-black text-white brutalist-border p-10 md:p-14 flex flex-col md:flex-row md:items-center justify-between gap-8">
<div>
<h2 class="headline-refined text-4xl md:text-5xl mb-4 text-primary">NEED YOUR OWN DESIGN?</h2>
<p class="font-mono text-sm uppercase tracking-wider opacity-80 max-w-xl">Custom logos, team colors and bulk orders are quoted individually. Tell us what you need.</p>
</div>
<a class="bg-primary text-black border-4 border-white px-8 py-4 font-headline font-black text-xl uppercase tracking-widest text-center hover:bg-white transition-colors" href="quote.html">GET A QUOTE</a>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/store-config.js"></script>
<script src="assets/site.js"></script>
<script>
    var S = window.TAGD_STORE;
    document.getElementById('product-grid').innerHTML = S.products.map(function (p) {
        return '<article class="bg-white border-4 border-black brutalist-shadow-sm flex flex-col">' +
            '<div class="p-2 bg-black text-white font-mono text-[10px] flex justify-between uppercase"><span>ID: ' + p.id + '</span><span class="text-primary">In Stock</span></div>' +
            '<div class="relative aspect-square bg-zinc-100 overflow-hidden"><img class="w-full h-full object-cover" src="' + p.image + '" alt="' + p.name + '"/>' +
            (p.tag ? '<span class="absolute top-3 left-3 bg-tertiary text-white font-mono text-[10px] font-bold px-2 py-1 border-2 border-black">' + p.tag + '</span>' : '') + '</div>' +
            '<div class="p-6 flex-grow"><h2 class="font-headline font-extrabold text-2xl uppercase tracking-tighter mb-2">' + p.name + '</h2>' +
            '<p class="text-sm text-on-surface-variant mb-4">' + p.description + '</p>' +
            '<div class="text-2xl font-black font-headline">$' + p.price.toFixed(2) + '</div></div>' +
            '<button type="button" data-add="' + p.id + '" class="w-full bg-primary border-t-4 border-black p-4 font-headline font-black uppercase tracking-widest hover:bg-black hover:text-white transition-colors">Add To Cart</button></article>';
    }).join('');
</script>
</body></html>
